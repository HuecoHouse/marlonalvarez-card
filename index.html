<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0d0d12">
<title>Marlon Alvarez | CEO | Founder at Hueco House</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="icon" type="image/svg+xml"
 href='data:image/svg+xml;utf8,
 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
   <rect width="128" height="128" rx="64" fill="%230f1018"/>
   <text x="50%" y="56%" text-anchor="middle" dominant-baseline="middle"
         fill="white" font-family="Inter, sans-serif" font-weight="700"

 </svg>'>

<style>
:root{
  --accent:#d0a96f;
  --text:#f8f8fb;
  --muted:rgba(245,245,250,0.75);
  --glass:rgba(9,10,20,0.56);
  --border:rgba(255,255,255,0.2);
  --blur:20px;
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Inter',sans-serif;
  background:radial-gradient(circle at 10% 10%, #181924 0%, #090b12 44%, #05060b 100%);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  perspective:1000px;
}
body::before{
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,0.14), transparent 35%),
    radial-gradient(circle at 80% 75%, rgba(208,169,111,0.24), transparent 35%);
  filter:blur(70px);
  pointer-events:none;
}

.card{
  width:min(500px,100%);
  padding:2.7rem;
  border-radius:24px;
  position:relative;
  overflow:hidden;
  border:1px solid var(--border);
  background:var(--glass);
  backdrop-filter:blur(var(--blur)) saturate(1.2);
  text-align:center;
  transform-style:preserve-3d;
  transition:transform .2s ease,box-shadow .4s ease;
  box-shadow:0 25px 80px rgba(0,0,0,.48),0 0 44px rgba(208,169,111,.24);
  isolation:isolate;
}
.card video,
.card::before,
.lighting,
.outer-glow{border-radius:inherit;}
.card video{
  position:absolute;
  inset:-10%;
  width:120%;
  height:120%;
  object-fit:cover;
  filter:brightness(0.6) contrast(1.15) saturate(0.65);
  opacity:.35;
  z-index:0;
  transition:transform .3s ease-out;
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.03) 45%,rgba(255,255,255,.08));
  z-index:1;
}
.outer-glow{
  content:"";
  position:absolute;
  inset:-40%;
  background:radial-gradient(circle at 50% 50%,rgba(208,169,111,.55),transparent 65%);
  z-index:0;
  filter:blur(80px);
  transition:opacity .6s ease;
}
.lighting{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:radial-gradient(circle at 50% 50%,rgba(208,169,111,.3),transparent 65%);
  mix-blend-mode:screen;
  z-index:2;
  transition:background .3s ease,opacity .6s ease;
  animation:breathe 9s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:.7}}

.card-content{position:relative;z-index:3}
.avatar{width:136px;height:136px;margin:0 auto 1rem}
.avatar img{
  width:100%;
  height:100%;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.45);
  object-fit:cover;
  box-shadow:0 0 40px rgba(208,169,111,.35);
}
h1{font-size:2rem;font-weight:700;margin-bottom:.35rem;color:var(--text);letter-spacing:.2px;}
h2{font-size:1.05rem;color:var(--accent);margin-bottom:.65rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
p{font-size:.95rem;color:var(--muted);margin-bottom:1.4rem;line-height:1.5;}

.company-strip{
  margin:0 auto 1.3rem;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.7rem;
}
.logo-pill{
  height:58px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06);
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  transition:all .35s ease;
}
.logo-pill svg{width:88%;max-width:160px;height:28px}
.logo-pill path,.logo-pill rect,.logo-pill text{fill:#ffffff}
.logo-pill:hover{
  transform:translateY(-2px);
  background:rgba(255,255,255,.12);
  border-color:rgba(208,169,111,.8);
  box-shadow:0 8px 26px rgba(0,0,0,.38), 0 0 22px rgba(208,169,111,.3);
}

.buttons{display:flex;flex-direction:column;gap:.75rem}
a.button{
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.24);
  color:var(--text);text-decoration:none;
  padding:.9rem 1.2rem;border-radius:11px;
  font-weight:500;
  display:flex;align-items:center;justify-content:center;
  gap:10px;
  backdrop-filter:blur(10px);
  transition:all .4s cubic-bezier(0.25,1,0.5,1);
}
a.button span{transition:transform .4s cubic-bezier(0.25,1,0.5,1);}
a.button:hover{
  background:rgba(255,255,255,.16);
  transform:translateY(-3px);
  box-shadow:0 0 25px rgba(208,169,111,.35);
}
a.button:hover span{transform:translateX(6px);}
a.button svg{
  width:22px;height:22px;fill:var(--accent);
  opacity:0;transform:translateY(8px);
  animation:iconFade .7s cubic-bezier(0.25,1,0.5,1) forwards;
  transition:all .4s cubic-bezier(0.25,1,0.5,1);
}
@keyframes iconFade{to{opacity:1;transform:translateY(0)}}
a.button:nth-child(1) svg{animation-delay:.1s}
a.button:nth-child(2) svg{animation-delay:.2s}
a.button:nth-child(3) svg{animation-delay:.3s}
a.button:nth-child(4) svg{animation-delay:.4s}
a.button:hover svg{
  animation:pulseGlow .6s ease-out 1;
  opacity:1;transform:translateY(0);
}
a.button:not(:hover) svg{opacity:0;transform:translateX(-8px);}
@keyframes pulseGlow{
  0%{filter:drop-shadow(0 0 0 rgba(208,169,111,0))}
  50%{filter:drop-shadow(0 0 10px rgba(208,169,111,.9)) scale(1.05)}
  100%{filter:drop-shadow(0 0 0 rgba(208,169,111,0))}
}
footer{
  margin-top:2.3rem;padding-top:1.25rem;
  border-top:1px solid rgba(255,255,255,.23);
  font-size:.8rem;color:rgba(255,255,255,.63);
  letter-spacing:.5px;
  opacity:0;animation:fadeIn .8s ease forwards;animation-delay:.6s;
}
@keyframes fadeIn{to{opacity:1}}
footer a{color:#fff;text-decoration:none;font-weight:600}
footer a:hover{color:var(--accent)}

@media (max-width:560px){
  .card{padding:2rem 1.25rem}
  .company-strip{grid-template-columns:1fr;}
}
</style>
</head>

<body>
<main class="card" id="card">
  <div class="outer-glow" id="outerGlow"></div>

  <video autoplay muted loop playsinline>
    <source src="background.mp4" type="video/mp4">
  </video>

  <div class="lighting" id="lighting"></div>
  <div class="card-content">
    <div class="avatar">
      <img src="Dynamic Headshots M1 Small.jpg" alt="Portrait of Marlon Alvarez">
    </div>
    <h1>Marlon Alvarez</h1>
    <h2>CEO | Founder</h2>
    <p>Built for high-end experiences.<br>Hueco House LLC · Port St. Lucie, FL</p>

    <div class="company-strip" aria-label="Founded companies">
      <a class="logo-pill" href="https://huecohouse.com" target="_blank" rel="noopener" aria-label="Hueco House">
        <svg viewBox="0 0 220 48" role="img" aria-hidden="true">
          <rect x="2" y="5" width="38" height="38" rx="8"></rect>
          <rect x="11" y="13" width="8" height="22" fill="#05060b"></rect>
          <rect x="23" y="13" width="8" height="22" fill="#05060b"></rect>
          <text x="50" y="31" font-family="Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="2">HUECO HOUSE</text>
        </svg>
      </a>
      <a class="logo-pill" href="https://marlonalvarez.com" target="_blank" rel="noopener" aria-label="Marlon Alvarez Ventures">
        <svg viewBox="0 0 220 48" role="img" aria-hidden="true">
          <path d="M18 38V10h6l8 13 8-13h6v28h-6V22l-8 12-8-12v16z"></path>
          <text x="58" y="31" font-family="Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="1.5">ALVAREZ VENTURES</text>
        </svg>
      </a>
    </div>

    <div class="buttons">
      <a class="button" href="tel:+17729007865">
        <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.05-.24 11.36 11.36 0 003.56.57 1 1 0 011 1v3.61a1 1 0 01-1 1A17.91 17.91 0 012 5a1 1 0 011-1h3.61a1 1 0 011 1 11.36 11.36 0 00.57 3.56 1 1 0 01-.24 1.05z"/></svg>
        <span>Call</span>
      </a>
      <a class="button" href="mailto:contact@marlonalvarez.com">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v.01L12 13l8-6.99V6H4z"/></svg>
        <span>Email</span>
      </a>
      <a class="button" href="https://huecohouse.com" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1010 10A10 10 0 0012 2zm0 2a8 8 0 018 8h-4.26A9.8 9.8 0 0012 4zm0 16a8 8 0 01-8-8h4.26A9.8 9.8 0 0012 20zm0-8a8.35 8.35 0 011.74-5H10.26A8.35 8.35 0 0112 12zm0 0a8.35 8.35 0 01-1.74 5h3.48A8.35 8.35 0 0112 12z"/></svg>
        <span>Website</span>

      <a class="button" href="data:text/vcard;charset=utf-8,BEGIN:VCARD%0AVERSION:3.0%0AN:Alvarez;Marlon;;;%0AFN:Marlon%20Alvarez%0AORG:Hueco%20House%2C%20LLC%0ATITLE:CEO%20%7C%20Founder%0ATEL:+17729007865%0AEMAIL:contact@marlonalvarez.com%0AURL:https://huecohouse.com%0AADR:;;Port%20St.%20Lucie%2C%20FL;;;;%0AEND:VCARD" download="Marlon_Alvarez.vcf">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4.33 0-8 2.17-8 4.84V22h16v-3.16C20 16.17 16.33 14 12 14z"/></svg>

    </div>

    <footer>© 2026 <a href="https://huecohouse.com" target="_blank">Hueco House</a> · All Rights Reserved</footer>
  </div>
</main>

<script>
(()=>{
  const card=document.getElementById('card');
  const bgVideo=card.querySelector('video');
  const lighting=document.getElementById('lighting');
  const outer=document.getElementById('outerGlow');
  let idleTimeout;
  const reset=()=>{
    card.style.transform='rotateY(0deg) rotateX(0deg) scale(1)';
    bgVideo.style.transform='translate(0,0) scale(1)';
    lighting.style.background='radial-gradient(circle at 50% 50%, rgba(208,169,111,.35), transparent 70%)';
    outer.style.opacity='0.45';
  };
  const handleMove=e=>{
    const point='touches' in e?e.touches[0]:e;
    const x=(point.clientX/window.innerWidth-0.5)*10;
    const y=(point.clientY/window.innerHeight-0.5)*10;
    card.style.transform=`rotateY(${x}deg) rotateX(${-y}deg) scale(1.02)`;
    const moveX=-x*2.8,moveY=y*2.8;
    bgVideo.style.transform=`translate(${moveX}px,${moveY}px) scale(1.06)`;
    const lightX=(point.clientX/window.innerWidth)*100;
    const lightY=(point.clientY/window.innerHeight)*100;
    lighting.style.background=`radial-gradient(circle at ${lightX}% ${lightY}%, rgba(208,169,111,.52), transparent 67%)`;
    outer.style.background=`radial-gradient(circle at ${lightX}% ${lightY}%, rgba(208,169,111,.6), transparent 70%)`;
    outer.style.opacity='0.75';
    lighting.style.animation='none';
    clearTimeout(idleTimeout);
    idleTimeout=setTimeout(()=>{
      lighting.style.animation='breathe 9s ease-in-out infinite';
      outer.style.opacity='0.45';
    },2000);
  };
  document.addEventListener('mousemove',handleMove,{passive:true});
  document.addEventListener('touchmove',handleMove,{passive:true});
  document.addEventListener('mouseleave',reset);
})();
</script>
</body>
</html>
